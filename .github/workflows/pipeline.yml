name: Extension Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest JSON
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(!manifest.name||!manifest.version||!manifest.manifest_version){throw new Error('manifest.json is missing required fields');}"

      - name: Syntax check extension scripts
        run: |
          node --check background.js
          node --check copy.js
          node --check getPagesSource.js
          node --check popup.js

  package:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create extension package
        run: |
          mkdir -p dist
          zip -r dist/intelius-extension.zip \
            manifest.json \
            background.js \
            getPagesSource.js \
            popup.html \
            popup.js \
            copy.js \
            intelius.png \
            intelius2.png

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: intelius-extension
          path: dist/intelius-extension.zip
